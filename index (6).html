<!DOCTYPE html>
<!-- ELEMENT FIGHTERS - single-file browser fighting game (HTML5 canvas + Web Audio + Gamepad API + WebRTC).
     Host on GitHub Pages: put this file in a repo as index.html, then Settings > Pages > deploy from branch. No build step, no dependencies. -->
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Element Fighters</title>
<style>
:root{--bg:#0b0c14;--fg:#e8e8f0;--mut:#9a9cb5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0c14;--fg:#e8e8f0;--mut:#9a9cb5}}
:root[data-theme="dark"]{--bg:#0b0c14;--fg:#e8e8f0;--mut:#9a9cb5}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--bg);color:var(--fg);font:13px system-ui,sans-serif}
#wrap{max-width:960px;margin:0 auto;position:relative}
#net{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,4,15,.9);overflow:auto;padding:8px;box-sizing:border-box;z-index:5}
#net[hidden],#net [hidden]{display:none}
#net .card{max-width:640px;width:100%;color:var(--fg);font:14px system-ui,sans-serif}
#net h2{margin:0 0 6px;font-size:22px;color:#ffd84a}
#net p{margin:4px 0 10px;color:var(--mut)}
#net label{display:block;margin:10px 0 4px;font-weight:600}
#net textarea{width:100%;height:64px;box-sizing:border-box;font:11px ui-monospace,monospace;background:#12101f;color:#dfe3ff;border:1px solid #445;border-radius:6px;padding:6px;word-break:break-all}
#net button{font:600 14px system-ui,sans-serif;margin:6px 8px 0 0;padding:8px 14px;border-radius:8px;border:0;background:#ffd84a;color:#1a1530;cursor:pointer}
#net button.alt{background:#2a2750;color:#e8e8f0}
canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;background:#000;outline:none}
p{margin:6px 10px;color:var(--mut);line-height:1.5}
</style></head><body><div id="wrap">

<div id="net" hidden><div class="card">

  <label>2. Paste the reply code they send back</label><textarea id="ans" placeholder="Paste reply code here"></textarea><button id="connect">Connect</button><button id="bback2" class="alt">Cancel</button>
 </div>
 <div id="njoin" hidden>
  <label>1. Paste the invite code from the host</label><textarea id="inv" placeholder="Paste invite code here"></textarea><button id="mkans">Create reply code</button>

</div></div>

const BLD=(n,seed,wmin,wspan,hmin,hspan)=>Array.from({length:n},(_,i)=>({x:i*(1100/n)-80,w:wmin+(i*seed%wspan),h:hmin+(i*(seed+16)%hspan),i}));
const FAR=BLD(18,37,40,34,90,120),NEAR=BLD(10,53,60,40,120,150);
function building(b,cx,par,col,win,dim){const x=b.x-cx*par,y=GROUND-b.h;ctx.fillStyle=col;ctx.fillRect(x,y,b.w,b.h+10);
 ctx.fillStyle=win;ctx.globalAlpha=dim;for(let r=0;r<Math.floor(b.h/18);r++)for(let c=0;c<Math.floor(b.w/14);c++)if((b.i*31+r*17+c*7)%5<2)ctx.fillRect(x+5+c*14,y+8+r*18,7,9);ctx.globalAlpha=1}
function drawBG(){const S=STAGES[stage],cx=((p1.x+dm.x)/2-480),T=performance.now()/1000;
 let g=ctx.createLinearGradient(0,0,0,GROUND);g.addColorStop(0,S.sky[0]);g.addColorStop(.55,S.sky[1]);g.addColorStop(1,S.sky[2]);ctx.fillStyle=g;ctx.fillRect(-40,-40,H*2,GROUND+40);
 ctx.fillStyle='#fff';stars.forEach(s=>{ctx.globalAlpha=(S.pt===1?.9:.3)*(.4+.6*Math.abs(Math.sin(s.x+T)));ctx.fillRect(s.x-cx*.02-60,s.y,s.r,s.r)});ctx.globalAlpha=1;
 glow(700-cx*.03,140,170,S.orb+'aa');disc(700-cx*.03,140,38,S.orb,0);
 ctx.fillStyle='rgba(255,255,255,.14)';for(let k=0;k<5;k++){const x=((k*260+T*(8+k*3))%1300)-170-cx*.04,y=70+k*34;ctx.beginPath();ctx.ellipse(x,y,90,16,0,0,7);ctx.ellipse(x+50,y-8,60,14,0,0,7);ctx.fill()}
 const mx=300-cx*.04;ctx.fillStyle=S.mt;ctx.beginPath();ctx.moveTo(mx-260,GROUND-60);ctx.lineTo(mx,GROUND-290);ctx.lineTo(mx+260,GROUND-60);ctx.fill();
 ctx.fillStyle=S.cap;ctx.beginPath();ctx.moveTo(mx-62,GROUND-232);ctx.lineTo(mx,GROUND-290);ctx.lineTo(mx+62,GROUND-232);ctx.lineTo(mx+30,GROUND-244);ctx.lineTo(mx,GROUND-226);ctx.lineTo(mx-30,GROUND-244);ctx.fill();
 FAR.forEach(b=>building(b,cx,.05,S.far,S.win,.35));NEAR.forEach(b=>building(b,cx,.1,S.near,S.win,.7));
 g=ctx.createLinearGradient(0,GROUND,0,H);g.addColorStop(0,S.fl[0]);g.addColorStop(1,S.fl[1]);ctx.fillStyle=g;ctx.fillRect(-40,GROUND,H*2,H-GROUND);
 ctx.fillStyle='rgba(255,255,255,.18)';ctx.fillRect(-40,GROUND,H*2,3);
 ctx.strokeStyle='rgba(255,255,255,.08)';ctx.lineWidth=1;ctx.beginPath();for(let i=-6;i<=16;i++){ctx.moveTo(i*60+30-cx*.2,GROUND);ctx.lineTo((i*60+30-cx*.2-480)*2.2+480,H)}for(let k=1;k<5;k++){const y=GROUND+k*k*5;ctx.moveTo(0,y);ctx.lineTo(W,y)}ctx.stroke();
 for(let k=0;k<46;k++){const sp=S.pt===1?420:S.pt===2?55+k%5*12:28+k%6*8,x=((k*97+(S.pt===1?0:T*(14+k%7*5)))%1000)-20,y=((k*53+T*sp)%570)-12;
  if(S.pt===1){ctx.strokeStyle='rgba(170,200,255,.35)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-3,y+14);ctx.stroke()}
  else{ctx.fillStyle=S.pt===2?'rgba(255,255,255,.85)':'rgba(255,170,200,.8)';ctx.beginPath();ctx.arc(x,y,S.pt===2?2:3,0,7);ctx.fill()}}
}
function vignette(){const g=ctx.createRadialGradient(480,270,260,480,270,620);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.45)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
function drawFighter(f){
 const C=CH[f.ch]||CH.elem,sc=C.sc,air=f.y<GROUND,s=clamp(1-(GROUND-f.y)/400,.4,1);
 ctx.fillStyle='rgba(0,0,0,.45)';ctx.beginPath();ctx.ellipse(f.x,GROUND+4,40*s*sc,8*s,0,0,7);ctx.fill();
 ctx.save();ctx.translate(f.x+(f.state==='hit'&&f.stop>0?(f.stop%2?3:-3):0),f.y);ctx.scale(f.face,1);ctx.scale(sc,sc);
 // status effects behind the body
 if(f.burn>0){const G=ctx.createRadialGradient(0,-80,5,0,-80,90);G.addColorStop(0,f.burnBlue?'rgba(60,150,255,.6)':'rgba(255,140,20,.55)');G.addColorStop(1,'rgba(255,60,0,0)');ctx.fillStyle=G;ctx.fillRect(-100,-180,200,200);ctx.fillStyle=f.burnBlue?'#8fd0ff':'#ffb347';for(let i=0;i<3;i++)ctx.fillRect(-20+i*20+Math.sin(f.t*.4+i)*5,-150-(f.t*3+i*17)%50,6,10)}
 if(f.wet>0){ctx.fillStyle='rgba(120,190,255,.7)';for(let i=0;i<4;i++)ctx.fillRect(-24+i*14,-120+(f.t*4+i*23)%110,3,8)}
 if(f.armor>0){ctx.strokeStyle='rgba(190,150,90,.8)';ctx.lineWidth=5;ctx.strokeRect(-34,-170,68,170)}
 if(f.charge>0){ctx.strokeStyle='rgba(150,240,255,.9)';ctx.lineWidth=2;ctx.beginPath();for(let i=0;i<4;i++){ctx.moveTo((Math.random()-.5)*60,-Math.random()*160);ctx.lineTo((Math.random()-.5)*60,-Math.random()*160)}ctx.stroke()}
 if(f.pg>0){ctx.strokeStyle='rgba(255,230,120,'+(.35+.55*f.pg/30)+')';ctx.lineWidth=5;ctx.beginPath();ctx.arc(0,-85,80,0,7);ctx.stroke()}
 // animation: idle breathing, lean into attacks, tumble when launched, lie flat when down, squash on landing
 const idle=f.state==='free'&&!f.crouch&&Math.abs(f.vx)<.5,bob=idle?Math.sin(f.t*.09)*2:0,sqz=f.sq>0?1-f.sq*.012:1;
 let lean=0;
 if(f.state==='hit')lean=f.launched?-.5-f.vy*.04:-.2;else if(f.state==='down')lean=-1.5;else if(f.state==='block')lean=-.06;
 else if(f.state==='atk'){const A=ATK[f.atk];lean=f.af>A.st&&f.af<=A.st+A.ac?.16:.04}
 else if(f.state==='free')lean=f.vx*f.face*.015;else if(f.state==='air')lean=f.vx*f.face*.02-.05;
 if(f.state==='down')ctx.translate(-30,-6);
 ctx.translate(0,bob);ctx.rotate(lean);ctx.scale(1,sqz);
 const h=f.crouch&&!air?.68:1,flash=f.state==='hit'&&f.stop>0;
 ({elem:drawElem,andrew:drawAndrew,swag:drawSwag}[f.ch]||drawElem)(f,h,sc,flash);atkFx(f,h,sc);
 ctx.restore();dbgBoxes(f)}
function drawFx(){
 for(const e of fx){
  if(e.t==='spark'){const k=e.life/10;ctx.strokeStyle=e.c;ctx.lineWidth=3;ctx.beginPath();
   for(let i=0;i<8;i++){const a=i*Math.PI/4+e.x,r1=e.r*(1-k)*.5,r2=e.r*(1.1-k*.6);ctx.moveTo(e.x+Math.cos(a)*r1,e.y+Math.sin(a)*r1);ctx.lineTo(e.x+Math.cos(a)*r2,e.y+Math.sin(a)*r2)}ctx.stroke()}
  else if(e.t==='ring'){ctx.strokeStyle=e.c;ctx.globalAlpha=e.life/14;ctx.lineWidth=4;ctx.beginPath();ctx.arc(e.x,e.y,e.r*(1-e.life/14)+8,0,7);ctx.stroke();ctx.globalAlpha=1}
  else if(e.t==='ghost'){ctx.globalAlpha=e.life/28;ctx.fillStyle=e.c;ctx.save();ctx.translate(e.x,e.y);ctx.scale(e.face,1);ctx.fillRect(-22,-122,44,52);ctx.fillRect(-14,-70,28,70);ctx.beginPath();ctx.arc(2,-138,15,0,7);ctx.fill();ctx.restore();ctx.globalAlpha=1}
  else if(e.t==='dust'){ctx.fillStyle=`rgba(200,190,230,${e.life/40})`;ctx.beginPath();ctx.arc(e.x,e.y,e.r*(1.5-e.life/30),0,7);ctx.fill()}
  else{ctx.font='bold 22px system-ui';ctx.textAlign='center';ctx.fillStyle=e.c;ctx.globalAlpha=Math.min(1,e.life/15);ctx.strokeStyle='#000';ctx.lineWidth=4;ctx.strokeText(e.txt,e.x,e.y);ctx.fillText(e.txt,e.x,e.y);ctx.globalAlpha=1}
 }
}
/* ============ 8. HUD ============ */
function bar(x,y,w,f,right){const mhp=MV.maxHP,wl=w*f.lag/mhp,wh=w*f.hp/mhp,low=f.hp/mhp<.3;
 ctx.fillStyle='rgba(8,6,20,.78)';ctx.fillRect(x-4,y-4,w+8,26);
 ctx.fillStyle='#e8a317';ctx.fillRect(right?x+w-wl:x,y,wl,18);
 const g=ctx.createLinearGradient(0,y,0,y+18);g.addColorStop(0,low?'#ff8a6a':'#8cffb0');g.addColorStop(1,low?'#d02a1a':'#1fb860');ctx.fillStyle=g;ctx.fillRect(right?x+w-wh:x,y,wh,18);
 ctx.fillStyle='rgba(255,255,255,.28)';ctx.fillRect(right?x+w-wh:x,y,wh,6);
 ctx.strokeStyle='#e8e8f5';ctx.lineWidth=2;ctx.strokeRect(x-4,y-4,w+8,26);
 ctx.fillStyle='#fff';ctx.font='bold 14px system-ui';ctx.textAlign=right?'right':'left';ctx.fillText(f.name,right?x+w:x,y+38)}
function meterBar(x,y,f,right){const w=200,v=f.meter/MV.maxMeter;ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(x,y,w,9);ctx.fillStyle=f.meter>=MV.superCost?'#ffd84a':'#4aa3ff';ctx.fillRect(right?x+w-w*v:x,y,w*v,9);ctx.fillStyle='#fff';ctx.fillRect(x+w/2-1,y,2,9);ctx.fillStyle='#9a9cb5';ctx.font='10px system-ui';ctx.textAlign=right?'right':'left';ctx.fillText('SUPER  |  '+ELS[f.el].n,right?x+w:x,y+20);ctx.fillStyle=ELS[f.el].c;ctx.fillRect(right?x+w-6:x,y-3,6,15)}
function drawHUD(){
 bar(30,22,380,p1,false);bar(550,22,380,dm,true);meterBar(30,68,p1,false);meterBar(730,68,dm,true);
 ctx.fillStyle='#fff';ctx.font='bold 15px system-ui';ctx.textAlign='center';ctx.fillText(vs2?'VERSUS':mode===0?'FIGHT':'TRAINING',480,34);
 ctx.font='12px system-ui';ctx.fillStyle='#9a9cb5';ctx.fillText((net.on?'ONLINE':vs2?'2 PLAYERS':'VS CPU  |  Opponent: '+MODES[mode]),480,52);
 // pad indicator
 ctx.textAlign='right';ctx.fillStyle='#cfd2ea';ctx.fillText(`PAD1 ${pads[0]?'●':'○'}   PAD2 ${pads[1]?'●':'○'}`,930,98);
 if(combo.hits>=2){ctx.textAlign='left';ctx.font='bold 40px system-ui';ctx.fillStyle='#ffd84a';ctx.strokeStyle='#000';ctx.lineWidth=5;ctx.strokeText(combo.hits+' HITS',30,130);ctx.fillText(combo.hits+' HITS',30,130);
  ctx.font='bold 16px system-ui';ctx.fillStyle='#fff';ctx.fillText('Damage '+combo.dmg,32,152)}
 // input display
 const hd=in1.held||{},cx=52,cy=496;
 ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(8,462,540,70);
 ctx.strokeStyle='#667';ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,24,0,7);ctx.stroke();
 ctx.fillStyle='#ffd84a';ctx.beginPath();ctx.arc(cx+((hd.r||0)-(hd.l||0))*16,cy+((hd.d||0)-(hd.u||0))*16,7,0,7);ctx.fill();
 const lab=[['L','X'],['M','Y'],['H','B'],['K','A'],['T','LB'],['A','RB'],['G','LT'],['S','RT']];
 lab.forEach(([k,t],i)=>{const x=110+i*52;ctx.fillStyle=hd[k]?'#ffd84a':'#2a2d44';ctx.beginPath();ctx.arc(x,cy,15,0,7);ctx.fill();
  ctx.fillStyle=hd[k]?'#000':'#aab';ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.fillText(t,x,cy+4)});
 ctx.textAlign='left';ctx.fillStyle='#cfd2ea';ctx.font='12px system-ui';ctx.fillText(lastInfo||'Attack to see frame data here',560,494);
 if(ko>0){ctx.textAlign='center';ctx.font='bold 72px system-ui';ctx.fillStyle='#ff4a4a';ctx.strokeStyle='#000';ctx.lineWidth=8;ctx.strokeText('K.O.',480,230);ctx.fillText('K.O.',480,230);ctx.font='bold 26px system-ui';ctx.fillStyle='#fff';ctx.fillText(koMsg,480,270)}
 if(net.on&&net.stall>15){ctx.textAlign='center';ctx.fillStyle='#ff9a6a';ctx.font='bold 16px system-ui';ctx.fillText('Waiting for opponent...',480,160)}
 if(toastT>0){ctx.textAlign='center';ctx.font='bold 14px system-ui';ctx.fillStyle='#ffd84a';ctx.fillText(toastMsg,480,100)}
 if(!padSeen){ctx.textAlign='center';ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(250,114,460,24);ctx.fillStyle='#ffd84a';ctx.font='bold 13px system-ui';ctx.fillText('Press any button on your controller (or use the keyboard)',480,131)}
 if(paused||net.help){ctx.fillStyle=net.on?'rgba(0,0,0,.82)':'rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 40px system-ui';ctx.fillText(net.on?'MATCH IN PROGRESS':'PAUSED',480,56);if(pausePage)drawControls();else drawMoveList();
  ctx.font='15px system-ui';ctx.fillText((lastDev==='pad'?'Start: resume    View: reset positions    B: main menu    Left / Right: switch page':'Esc: resume    Backspace: reset positions    Q: main menu    Left / Right (or A / D): switch page'),480,92)}
}
function drawProj(){for(const f of[p1,dm])if(f.frozen>0){const q=hurt(f);ctx.fillStyle='rgba(170,230,255,.55)';ctx.fillRect(q[0]-6,q[1]-6,q[2]+12,q[3]+6);ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.strokeRect(q[0]-6,q[1]-6,q[2]+12,q[3]+6)}for(const p of proj){if(p.type==='bolt'||p.type==='wave'){drawBolt(p);continue}
 if(p.type==='zero'){ctx.fillStyle='rgba(190,240,255,.6)';ctx.fillRect(p.x-22,p.y-p.r*1.3,44,p.r*2.6);ctx.fillStyle='#fff';ctx.fillRect(p.x-6,p.y-p.r*1.3,12,p.r*2.6);continue}
 if(p.type==='pillar'||p.type==='bpillar'||p.type==='ipillar'){ctx.globalAlpha=.85;ctx.fillStyle=p.c;const hg=Math.min(1,(18-p.life)/5)*190;ctx.fillRect(p.x-24,GROUND-hg,48,hg);ctx.fillStyle='#fff';ctx.fillRect(p.x-8,GROUND-hg,16,hg);ctx.globalAlpha=1;continue}const g=ctx.createRadialGradient(p.x,p.y,2,p.x,p.y,p.r*1.6);g.addColorStop(0,'#fff');g.addColorStop(.35,p.c);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.r*1.6,0,7);ctx.fill();
 ctx.fillStyle=p.c;ctx.globalAlpha=.4;for(let i=1;i<5;i++){ctx.beginPath();ctx.arc(p.x-p.vx*i*1.2,p.y,p.r*(1-i*.17),0,7);ctx.fill()}ctx.globalAlpha=1}}
function render(){
 if(scene!=='fight'){drawMenus();return}
 ctx.save();ctx.clearRect(0,0,W,H);
 if(shake>.3)ctx.translate((Math.random()-.5)*shake*2,(Math.random()-.5)*shake*2);
 drawBG();drawFighter(dm);drawFighter(p1);drawProj();drawFx();
 if(vs2)for(const[f,tx,c]of[[p1,'P1','#ffd84a'],[dm,'P2','#ff6a6a']]){const q=hurt(f);ctx.fillStyle=c;ctx.font='bold 14px system-ui';ctx.textAlign='center';ctx.fillText('\u25bc '+(net.on?((f===p1)===net.host?'YOU':'OPP'):tx),f.x,q[1]-8)}ctx.restore();vignette();drawHUD();
}
requestAnimationFrame(loop);
